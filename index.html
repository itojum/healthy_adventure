<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヘルシーアドベンチャー</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 内部解像度は 1024x700 のまま、画面に収まるよう拡大・縮小する */
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 1024 / 700;
      width: min(100vw, calc(100vh * 1024 / 700));
      height: auto;
      outline: none;
      image-rendering: auto;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ccc;
      font: 16px sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1024" height="700"></canvas>
  <div id="loading">読み込み中…</div>
  <!-- PicoDX とゲーム本体を script/build で 1 ファイルにまとめたもの -->
  <script type="text/ruby" src="dist/game.rb"></script>
  <script src="vendor/picoruby/init.iife.js"></script>
</body>
</html>
