<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ヘルシーアドベンチャー</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* 内部解像度は 1024x700 のまま、画面に収まるよう拡大・縮小する */
    canvas {
      display: block;
      width: min(100vw, calc(100vh * 1024 / 700));
      height: auto;
      aspect-ratio: 1024 / 700;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="game" width="1024" height="700"></canvas>
  <!-- PicoDX を読み込んでから、ゲームの main.rb を読み込む -->
  <script type="text/ruby" src="vendor/picodx.rb"></script>
  <script type="text/ruby" src="main.rb"></script>
  <script src="vendor/picoruby/init.iife.js"></script>
</body>
</html>
